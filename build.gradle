plugins {
	id "fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://repo.sleeping.town/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Antique Atlas is optional at runtime (dedicated servers don't need it),
	// but it's required to compile the client mixin.
	modCompileOnly "folk.sisby:antique-atlas:${antique_atlas_version}"
	modCompileOnly "folk.sisby:surveyor:${surveyor_version}"

	// For `runClient` / `runServer` in development.
	modLocalRuntime "folk.sisby:antique-atlas:${antique_atlas_version}"
	modLocalRuntime "folk.sisby:surveyor:${surveyor_version}"
	localRuntime "folk.sisby:kaleido-config:${kaleido_config_version}"
}

processResources {
	def props = [
		version          : project.version,
		minecraft_version: minecraft_version,
		loader_version   : loader_version
	]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}
